<!-- stock/templates/stock/ajouter_fournisseur.html -->
{% extends 'base.html' %}

{% block title %}Ajouter un fournisseur - TechStock{% endblock %}

{% block content %}
<div class="mb-lg">
    <div class="text-sm text-secondary flex items-center gap-1 mb-1">
        <a class="hover:text-primary transition-colors" href="{% url 'fournisseurs:liste_fournisseurs' %}">Fournisseurs</a>
        <span class="material-symbols-outlined text-[16px]">chevron_right</span>
        <span class="text-on-surface font-semibold">Nouveau fournisseur</span>
    </div>
    <h2 class="text-3xl font-bold text-on-surface">Ajouter un fournisseur</h2>
</div>

<form method="POST" class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-lg max-w-xl">
    {% csrf_token %}

    <div class="mb-lg">
        <label class="block text-xs font-semibold text-secondary mb-1">Nom</label>
        <input name="nom" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none" type="text" required autofocus>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-lg mb-lg">
        <div>
            <label class="block text-xs font-semibold text-secondary mb-1">Téléphone</label>
            <input name="telephone" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none" type="text">
        </div>
        <div>
            <label class="block text-xs font-semibold text-secondary mb-1">Email</label>
            <input name="email" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none" type="email">
        </div>
    </div>
    <div class="mb-lg">
        <label class="block text-xs font-semibold text-secondary mb-1">Adresse</label>
        <input name="adresse" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none" type="text">
    </div>
    <div class="mb-lg">
        <label class="block text-xs font-semibold text-secondary mb-1">Ville</label>
        <input name="ville" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none" type="text">
    </div>

    <button type="submit" class="bg-primary-container text-on-primary-container font-semibold py-2 px-lg rounded-lg hover:bg-primary hover:text-white transition-colors">
        Créer le fournisseur
    </button>
</form>
{% endblock %}
