<!-- stock/_boutons_categories.html -->
<a href="?{% if recherche %}q={{ recherche }}{% endif %}"
   hx-get="{% url 'stock:liste_produits' %}" hx-include="#champ-recherche"
   hx-target="#zone-tableau-produits" hx-swap="innerHTML" hx-push-url="true"
   class="filtre-btn px-4 py-2 rounded-full text-sm font-semibold transition-colors {% if not categorie_selectionnee %}bg-primary text-white{% else %}bg-surface-container-lowest border border-outline-variant text-on-surface-variant hover:bg-surface-container-low{% endif %}">
    Tous
</a>
{% for categorie in categories %}
<a href="?categorie={{ categorie.id }}{% if recherche %}&q={{ recherche }}{% endif %}"
   hx-get="{% url 'stock:liste_produits' %}?categorie={{ categorie.id }}" hx-include="#champ-recherche"
   hx-target="#zone-tableau-produits" hx-swap="innerHTML" hx-push-url="true"
   class="filtre-btn px-4 py-2 rounded-full text-sm font-semibold transition-colors {% if categorie_selectionnee == categorie.id|stringformat:'s' %}bg-primary text-white{% else %}bg-surface-container-lowest border border-outline-variant text-on-surface-variant hover:bg-surface-container-low{% endif %}">
    {{ categorie.nom }}
</a>
{% endfor %}
