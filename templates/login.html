<!-- stock/templates/stock/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ config_magasin.nom_magasin }} - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">

    <div class="px-8 pt-8 pb-6 flex flex-col items-center text-center">
        {% if config_magasin.logo %}<img src="{{ config_magasin.logo.url }}" alt="{{ config_magasin.nom_magasin }}" class="w-32 mb-2">{% else %}<img src="{% static 'img/logo.png' %}" alt="{{ config_magasin.nom_magasin }}" class="w-32 mb-2">{% endif %}
    </div>

    <div class="px-8 pb-8">
        {% if form.errors %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded">
            Identifiant ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="username">IDENTIFIANT</label>
                <input class="block w-full px-3 py-2 border border-gray-300 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       id="username" name="username" placeholder="nom d'utilisateur" required type="text">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="password">MOT DE PASSE</label>
                <input class="block w-full px-3 py-2 border border-gray-300 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       id="password" name="password" placeholder="••••••••" required type="password">
            </div>
            <button class="w-full py-2 px-4 rounded shadow-sm text-white bg-blue-600 hover:bg-blue-700 transition-colors font-semibold"
                    type="submit">
                Se Connecter
            </button>
        </form>
    </div>

    <div class="bg-gray-50 py-3 px-8 border-t border-gray-200 text-center">
        <p class="text-sm text-gray-500">Problème de connexion ? Contactez l'administrateur</p>
    </div>
</div>
</body>
</html>
