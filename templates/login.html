{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config_magasin.nom_magasin }} - Connexion</title>

    <!-- Détection du thème avant le rendu pour éviter tout flash blanc/sombre -->
    <script>
        (function() {
            const themeStocke = localStorage.getItem('theme') || 'auto';
            const preferenceAppareil = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';

            let themeEffectif = (themeStocke === 'auto') ? preferenceAppareil : themeStocke;

            if (themeEffectif === 'sombre') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Inter', sans-serif; }

        /* Palette CLAIRE */
        :root {
            --color-primary: 0 74 198;
            --color-primary-container: 37 99 235;
            --color-on-primary-container: 238 239 255;
            --color-secondary: 85 95 109;
            --color-surface: 248 249 250;
            --color-surface-container-lowest: 255 255 255;
            --color-surface-container-low: 243 244 245;
            --color-surface-container: 237 238 239;
            --color-surface-container-high: 231 232 233;
            --color-outline-variant: 195 198 215;
            --color-on-surface: 25 28 29;
            --color-on-surface-variant: 67 70 85;
            --color-error: 186 26 26;
        }

        /* Palette SOMBRE */
        html.dark {
            --color-primary: 125 169 255;
            --color-primary-container: 37 99 235;
            --color-on-primary-container: 238 239 255;
            --color-secondary: 154 164 178;
            --color-surface: 18 20 23;
            --color-surface-container-lowest: 26 29 33;
            --color-surface-container-low: 32 35 40;
            --color-surface-container: 40 44 50;
            --color-surface-container-high: 49 54 61;
            --color-outline-variant: 58 63 71;
            --color-on-surface: 230 232 234;
            --color-on-surface-variant: 176 182 192;
            --color-error: 255 138 128;
        }

        html.dark img.assombrir-en-sombre { filter: brightness(0.9); }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "rgb(var(--color-primary) / <alpha-value>)",
                        "primary-container": "rgb(var(--color-primary-container) / <alpha-value>)",
                        "on-primary-container": "rgb(var(--color-on-primary-container) / <alpha-value>)",
                        "secondary": "rgb(var(--color-secondary) / <alpha-value>)",
                        "surface": "rgb(var(--color-surface) / <alpha-value>)",
                        "surface-container-lowest": "rgb(var(--color-surface-container-lowest) / <alpha-value>)",
                        "surface-container-low": "rgb(var(--color-surface-container-low) / <alpha-value>)",
                        "surface-container": "rgb(var(--color-surface-container) / <alpha-value>)",
                        "surface-container-high": "rgb(var(--color-surface-container-high) / <alpha-value>)",
                        "outline-variant": "rgb(var(--color-outline-variant) / <alpha-value>)",
                        "on-surface": "rgb(var(--color-on-surface) / <alpha-value>)",
                        "on-surface-variant": "rgb(var(--color-on-surface-variant) / <alpha-value>)",
                        "error": "rgb(var(--color-error) / <alpha-value>)",
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-surface-container-lowest sm:bg-surface text-on-surface min-h-screen flex items-center justify-center p-0 sm:p-4">

<div class="w-full h-full min-h-screen sm:min-h-0 sm:max-w-[440px] bg-surface-container-lowest sm:shadow-lg sm:border sm:border-outline-variant sm:rounded-xl overflow-hidden flex flex-col justify-center relative">

    <!-- Bouton Thème : Icône seule au repos, déroulé complet au survol -->
    <div class="pt-6 px-6 flex justify-end">
        <div class="group relative inline-flex items-center p-1 bg-surface-container-low border border-outline-variant rounded-full transition-all duration-300 ease-in-out shadow-sm hover:shadow-md">
            
            <!-- Liste des thèmes (icône + nom) masquée au repos et déroulée au survol -->
            <div class="max-w-0 opacity-0 overflow-hidden group-hover:max-w-[260px] group-hover:opacity-100 transition-all duration-300 ease-in-out flex items-center gap-1 pr-1">
                <button type="button" 
                        onclick="selectionnerTheme('clair')" 
                        id="btn-option-clair"
                        title="Thème Clair"
                        class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold text-on-surface-variant hover:bg-surface-container-high transition-all whitespace-nowrap">
                    <span class="material-symbols-outlined text-sm">light_mode</span>
                    <span>Clair</span>
                </button>

                <button type="button" 
                        onclick="selectionnerTheme('sombre')" 
                        id="btn-option-sombre"
                        title="Thème Sombre"
                        class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold text-on-surface-variant hover:bg-surface-container-high transition-all whitespace-nowrap">
                    <span class="material-symbols-outlined text-sm">dark_mode</span>
                    <span>Sombre</span>
                </button>

                <button type="button" 
                        onclick="selectionnerTheme('auto')" 
                        id="btn-option-auto"
                        title="Thème Auto"
                        class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold text-on-surface-variant hover:bg-surface-container-high transition-all whitespace-nowrap">
                    <span class="material-symbols-outlined text-sm">desktop_windows</span>
                    <span>Auto</span>
                </button>
            </div>

            <!-- Icône SEULE du thème actuel (visible au repos) -->
            <div id="badge-theme-actuel" class="w-7 h-7 flex items-center justify-center bg-primary text-white rounded-full transition-all cursor-pointer">
                <span id="icone-theme-actuel" class="material-symbols-outlined text-base">desktop_windows</span>
            </div>
        </div>
    </div>

    <!-- En-tête Logo -->
    <div class="px-6 pt-2 pb-6 flex flex-col items-center text-center">
        {% if config_magasin.logo %}
            <img src="{{ config_magasin.logo.url }}" alt="{{ config_magasin.nom_magasin }}" class="w-32 mb-2 assombrir-en-sombre">
        {% else %}
            <img src="{% static 'img/logo.png' %}" alt="{{ config_magasin.nom_magasin }}" class="w-32 mb-2 assombrir-en-sombre">
        {% endif %}
    </div>

    <!-- Formulaire -->
    <div class="px-6 pb-8">
        {% if form.errors %}
        <div class="mb-4 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-error text-sm rounded">
            Identifiant ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1" for="username">IDENTIFIANT</label>
                <input class="block w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"
                       id="username" name="username" placeholder="nom d'utilisateur" required type="text">
            </div>

            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1" for="password">MOT DE PASSE</label>
                <div class="relative">
                    <input class="block w-full pl-3 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"
                           id="password" name="password" placeholder="••••••••" required type="password">
                    <button type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none"
                            aria-label="Afficher ou masquer le mot de passe">
                        <span id="eyeIcon" class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <button class="w-full py-2.5 px-4 rounded shadow-sm text-white bg-primary hover:opacity-90 transition-opacity font-semibold"
                    type="submit">
                Se Connecter
            </button>
        </form>
    </div>

    <!-- Pied de page -->
    <div class="bg-transparent sm:bg-surface-container-low py-4 px-6 border-t-0 sm:border-t sm:border-outline-variant text-center">
        <p class="text-xs sm:text-sm text-on-surface-variant">Problème de connexion ? Contactez l'administrateur</p>
    </div>
</div>

<script>
    /* 1. Affichage / Masquage Mot de Passe */
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    /* 2. Gestion Dynamique du Thème */
    const mapIcones = {
        'clair': 'light_mode',
        'sombre': 'dark_mode',
        'auto': 'desktop_windows'
    };

    function appliquerTheme(valeur) {
        let sombre;
        if (valeur === 'sombre') {
            sombre = true;
        } else if (valeur === 'clair') {
            sombre = false;
        } else {
            sombre = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        document.documentElement.classList.toggle('dark', sombre);
        localStorage.setItem('theme', valeur);
        mettreAJourBadge(valeur);
    }

    function selectionnerTheme(valeur) {
        appliquerTheme(valeur);
    }

    function mettreAJourBadge(valeurActive) {
        const iconeBadge = document.getElementById('icone-theme-actuel');
        if (iconeBadge) iconeBadge.textContent = mapIcones[valeurActive] || 'desktop_windows';

        // Met en évidence le bouton sélectionné dans le menu déroulant
        ['clair', 'sombre', 'auto'].forEach(mode => {
            const btn = document.getElementById(`btn-option-${mode}`);
            if (btn) {
                if (mode === valeurActive) {
                    btn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-primary-container text-on-primary-container transition-all whitespace-nowrap";
                } else {
                    btn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold text-on-surface-variant hover:bg-surface-container-high transition-all whitespace-nowrap";
                }
            }
        });
    }

    // Réagir aux changements système si en mode auto
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if ((localStorage.getItem('theme') || 'auto') === 'auto') {
            document.documentElement.classList.toggle('dark', e.matches);
        }
    });

    // Initialisation
    document.addEventListener('DOMContentLoaded', () => {
        const themeStocke = localStorage.getItem('theme') || 'auto';
        appliquerTheme(themeStocke);
    });
</script>

</body>
</html>
