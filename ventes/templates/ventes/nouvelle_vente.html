<!-- stock/templates/stock/nouvelle_vente.html -->
{% extends 'base.html' %}

{% block title %}Nouvelle vente - TechStock{% endblock %}

{% block content %}
<div class="mb-lg">
    <h2 class="text-3xl font-bold text-on-surface">Nouvelle vente</h2>
    <p class="text-secondary mt-1">Enregistrer une transaction en boutique</p>
</div>

<form method="POST" class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-lg max-w-3xl">
    {% csrf_token %}

    <div class="mb-lg">
        <label class="block text-xs font-semibold text-secondary mb-2">Client</label>

        <div class="flex gap-md mb-md text-sm">
            <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="mode_client" value="existant" checked onclick="basculerModeClient('existant')"> Client existant
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="mode_client" value="nouveau" onclick="basculerModeClient('nouveau')"> Nouveau client
            </label>
        </div>

        <div id="bloc-client-existant">
            <select name="client" class="w-full bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none">
                <option value="">Client anonyme</option>
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.nom }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="bloc-client-nouveau" class="hidden grid grid-cols-1 md:grid-cols-3 gap-2">
            <input type="text" name="nouveau_client_nom" placeholder="Nom du client" class="bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none">
            <input type="text" name="nouveau_client_telephone" placeholder="Téléphone" class="bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none">
            <input type="email" name="nouveau_client_email" placeholder="Email (optionnel)" class="bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none">
        </div>
    </div>

    <h3 class="text-sm font-semibold text-secondary uppercase tracking-wider mb-2">Produits vendus</h3>

    <div id="lignes-produits" class="space-y-2 mb-md">
        <div class="ligne-produit flex gap-2 items-center">
            <select name="produit" required class="flex-1 bg-surface border border-outline-variant rounded p-2 focus:border-primary outline-none">
                <option value="">-- Choisir un produit --</option>
                {% for produit in produits %}
                <option value="{{ produit.id }}">{{ produit.nom }} ({{ produit.prix_vente }} FCFA)</option>
                {% endfor %}
            </select>
            <input type="number" name="quantite" min="1" value="1" required class="w-24 bg-surface border border-outline-variant rounded p-2 font-mono text-right focus:border-primary outline-none">
            <button type="button" onclick="supprimerLigne(this)" class="text-secondary hover:text-error p-2">
                <span class="material-symbols-outlined text-[18px]">delete</span>
            </button>
        </div>
    </div>

    <button type="button" onclick="ajouterLigne()" class="flex items-center gap-1 text-primary font-semibold text-sm mb-lg hover:underline">
        <span class="material-symbols-outlined text-[18px]">add</span> Ajouter un produit
    </button>

    <div class="pt-md border-t border-outline-variant">
        <button type="submit" class="bg-primary-container text-on-primary-container font-semibold py-2 px-lg rounded-lg hover:bg-primary hover:text-white transition-colors">
            Valider la vente
        </button>
    </div>
</form>

<script>
    function ajouterLigne() {
        const conteneur = document.getElementById('lignes-produits');
        const premiereLigne = conteneur.querySelector('.ligne-produit');
        const nouvelleLigne = premiereLigne.cloneNode(true);
        nouvelleLigne.querySelector('select').value = '';
        nouvelleLigne.querySelector('input').value = 1;
        conteneur.appendChild(nouvelleLigne);
    }

    function supprimerLigne(bouton) {
        const conteneur = document.getElementById('lignes-produits');
        if (conteneur.querySelectorAll('.ligne-produit').length > 1) {
            bouton.closest('.ligne-produit').remove();
        }
    }

    function basculerModeClient(mode) {
        document.getElementById('bloc-client-existant').classList.toggle('hidden', mode !== 'existant');
        document.getElementById('bloc-client-nouveau').classList.toggle('hidden', mode !== 'nouveau');
    }
</script>
{% endblock %}
