{% extends 'commandes/_portail_base.html' %}
{% block title %}Créer un compte - {{ config_magasin.nom_magasin }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Créer un compte</h1>
    <p class="text-sm text-gray-500 mb-6">Commande en ligne et suis tes livraisons.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">Nom complet</label>
            <input name="nom" type="text" value="{{ nom }}" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-blue-500 outline-none">
        </div>
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">Email</label>
            <input name="email" type="email" value="{{ email }}" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-blue-500 outline-none">
        </div>
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">Téléphone</label>
            <input name="telephone" type="text" value="{{ telephone }}" class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-blue-500 outline-none">
        </div>
        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-500 mb-1">Mot de passe</label>
            <input name="password" type="password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition-colors">
            Créer mon compte
        </button>
    </form>

    <p class="text-sm text-gray-500 text-center mt-6">
        Déjà un compte ? <a href="{% url 'accounts:login' %}" class="text-blue-600 font-semibold hover:underline">Se connecter</a>
    </p>
</div>
{% endblock %}
